name: Test quit_without_error suppresses failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create spelling config with a file containing misspellings
        run: |
          mkdir -p .github/actions/spelling
          touch .github/actions/spelling/expect.txt
          # Create a file with a deliberate misspelling to trigger unknown words
          mkdir -p test-content
          echo "This file has a deliberate mispeling for testing." > test-content/sample.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          GITHUB_TOKEN: ${{ github.token }}
          config: .github/actions/spelling
          post_comment: '0'
          quit_without_error: '1'
          experimental_path: '.'

      - name: Assert action ran (quit_without_error should suppress failures)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RESULT_CODE: ${{ steps.action.outputs.result_code }}
          UNKNOWN_WORDS: ${{ steps.action.outputs.unknown_words }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result_code: $RESULT_CODE"
          echo "unknown_words: $UNKNOWN_WORDS"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed (quit_without_error suppressed any failure)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo API calls fail)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
