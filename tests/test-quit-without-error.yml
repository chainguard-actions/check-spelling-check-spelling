name: Test quit_without_error suppresses failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up spelling config with empty expect list
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.github/actions/spelling"
          # Empty expect.txt - so any unknown words will be flagged
          touch "$GITHUB_WORKSPACE/.github/actions/spelling/expect.txt"
          # Copy excludes to limit scope
          cp "$GITHUB_WORKSPACE/tests/fixtures/spelling/excludes.txt" \
             "$GITHUB_WORKSPACE/.github/actions/spelling/excludes.txt"
          # Create a file with a clearly misspelled word to trigger unknown words
          # Use .c extension so it's not excluded by excludes.txt
          echo "thisisaverylongmisspelledwordxyzzy" > "$GITHUB_WORKSPACE/test-misspelled.c"
      - id: spelling
        uses: .
        with:
          config: .github/actions/spelling
          post_comment: '0'
          quit_without_error: '1'
          checkout: 'false'
          experimental_path: .
          event_aliases: '{"workflow_dispatch":"push"}'
        continue-on-error: true
      - name: Assert action did not fail the job
        run: |
          echo "PASS: action completed without failing the job (quit_without_error=1 worked)"
      - name: Assert result_code output is accessible
        env:
          RESULT_CODE: ${{ steps.spelling.outputs.result_code }}
          OUTCOME: ${{ steps.spelling.outcome }}
        run: |
          echo "result_code: '$RESULT_CODE'"
          echo "outcome: '$OUTCOME'"
          # With quit_without_error=1, the action should not fail the job
          # result_code may be non-zero if unknown words were found
          echo "PASS: result_code output is accessible"
