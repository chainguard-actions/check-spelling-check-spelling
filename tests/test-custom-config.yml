name: Test custom config path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create custom spelling config directory
        run: |
          mkdir -p custom-spelling-config
          # Create an expect.txt with a known word to accept
          echo "mispeling" > custom-spelling-config/expect.txt
          # Create a file with that word so it's "expected"
          mkdir -p test-content
          echo "This file has a mispeling that is expected." > test-content/sample.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          GITHUB_TOKEN: ${{ github.token }}
          config: custom-spelling-config
          post_comment: '0'
          quit_without_error: '1'
          experimental_path: '.'

      - name: Assert action ran with custom config
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RESULT_CODE: ${{ steps.action.outputs.result_code }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result_code: $RESULT_CODE"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed with custom config path"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo API calls fail)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
