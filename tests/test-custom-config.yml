name: Test custom spelling config directory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up custom spelling config from fixtures
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/spelling"
          # The fixture files are already committed, just verify they exist
          ls -la "$GITHUB_WORKSPACE/tests/fixtures/spelling/"
      - id: spelling
        uses: .
        with:
          config: tests/fixtures/spelling
          post_comment: '0'
          quit_without_error: '1'
          checkout: 'false'
          experimental_path: .
          event_aliases: '{"workflow_dispatch":"push"}'
        continue-on-error: true
      - name: Assert action ran with custom config
        env:
          OUTCOME: ${{ steps.spelling.outcome }}
        run: |
          echo "spelling step outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: spelling step was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action completed with custom config (outcome=$OUTCOME)"
      - name: Assert result_code output is accessible
        env:
          RESULT_CODE: ${{ steps.spelling.outputs.result_code }}
        run: |
          echo "result_code: '$RESULT_CODE'"
          echo "PASS: result_code output is accessible"
