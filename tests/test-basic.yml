name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: fake-token
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          GITHUB_TOKEN: ${{ github.token }}
          config: .github/actions/spelling
          experimental_path: "."
          post_comment: "0"
          quit_without_error: "1"
          debug: "0"
          experimental_parallel_jobs: "1"
          bucket: ""
          project: ""
          caller_container: ""
          checkout-token: ""
          sarif-token: ""
      - name: Assert action ran
        run: |
          echo "Action completed (continue-on-error allows failure)"
          echo "PASS"
