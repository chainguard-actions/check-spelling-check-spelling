name: Test basic usage with debug
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          GITHUB_TOKEN: ${{ github.token }}
          debug: '1'
          quit_without_error: '1'
          post_comment: '0'
          checkout: 'false'
          config: '.github/actions/spelling'
        continue-on-error: true
      - name: Assert action ran
        run: |
          echo "result_code: ${{ steps.action.outputs.result_code }}"
          echo "Action completed (with or without spelling errors)"
          echo "PASS"
