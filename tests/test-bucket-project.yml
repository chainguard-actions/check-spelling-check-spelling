name: Test bucket and project inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          bucket: check-spelling
          project: check-spelling
          quit_without_error: '1'
          post_comment: '0'
      - name: Assert action ran with bucket and project inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RESULT_CODE: ${{ steps.action.outputs.result_code }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result_code: $RESULT_CODE"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with bucket and project inputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under harness with sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
