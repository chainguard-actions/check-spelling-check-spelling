name: Test bucket and project inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          GITHUB_TOKEN: ${{ github.token }}
          bucket: 'check-spelling/check-spelling'
          project: 'main'
          quit_without_error: '1'
          post_comment: '0'
          checkout: 'false'
        continue-on-error: true
      - name: Assert action ran with bucket and project
        run: |
          echo "result_code: ${{ steps.action.outputs.result_code }}"
          echo "Action completed with bucket and project inputs"
          echo "PASS"
