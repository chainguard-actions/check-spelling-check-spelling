name: Test bucket and project inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create spelling config directory
        run: |
          mkdir -p .github/actions/spelling
          touch .github/actions/spelling/expect.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          GITHUB_TOKEN: ${{ github.token }}
          bucket: check-spelling
          project: main
          config: .github/actions/spelling
          post_comment: '0'
          quit_without_error: '1'
          experimental_path: '.'

      - name: Assert action ran with bucket and project inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RESULT_CODE: ${{ steps.action.outputs.result_code }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result_code: $RESULT_CODE"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully with bucket/project inputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with sentinel repo or remote bucket)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
