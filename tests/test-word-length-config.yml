name: Test word length configuration inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up spelling config from fixtures
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.github/actions/spelling"
          cp "$GITHUB_WORKSPACE/tests/fixtures/spelling/expect.txt" \
             "$GITHUB_WORKSPACE/.github/actions/spelling/expect.txt"
          cp "$GITHUB_WORKSPACE/tests/fixtures/spelling/excludes.txt" \
             "$GITHUB_WORKSPACE/.github/actions/spelling/excludes.txt"
      - id: spelling
        uses: .
        with:
          config: .github/actions/spelling
          post_comment: '0'
          quit_without_error: '1'
          checkout: 'false'
          experimental_path: .
          event_aliases: '{"workflow_dispatch":"push"}'
          shortest_word: '4'
          longest_word: '20'
        continue-on-error: true
      - name: Assert action ran with word length config
        env:
          OUTCOME: ${{ steps.spelling.outcome }}
          RESULT_CODE: ${{ steps.spelling.outputs.result_code }}
        run: |
          echo "outcome: '$OUTCOME'"
          echo "result_code: '$RESULT_CODE'"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: spelling step was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action accepted shortest_word and longest_word inputs (outcome=$OUTCOME)"
