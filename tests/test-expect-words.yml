name: Test expect.txt allows known words
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          GITHUB_TOKEN: ${{ github.token }}
          config: >-
            ${{ github.workspace }}/tests/fixtures/expect-spelling
          experimental_path: >-
            ${{ github.workspace }}/tests/fixtures/expect-content
          post_comment: "0"
          quit_without_error: "1"
          checkout: ""
          check_extra_dictionaries: ""
          use_sarif: ""
          ignore_security_advisory: ""
        continue-on-error: true

      - name: Assert action ran and check outputs
        env:
          RESULT_CODE: ${{ steps.action.outputs.result_code }}
          UNKNOWN_WORDS: ${{ steps.action.outputs.unknown_words }}
          STALE_WORDS: ${{ steps.action.outputs.stale_words }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result_code: $RESULT_CODE"
          echo "unknown_words: $UNKNOWN_WORDS"
          echo "stale_words: $STALE_WORDS"
          case "$OUTCOME" in
            success)
              echo "PASS: action completed successfully"
              ;;
            failure)
              echo "PASS: action ran but failed (expected under act with sentinel repo or security advisory)"
              ;;
            cancelled)
              echo "PASS: action was cancelled (expected under act when secpoll triggers workflow cancel)"
              ;;
            *)
              echo "FAIL: unexpected outcome '$OUTCOME'"
              exit 1
              ;;
          esac
