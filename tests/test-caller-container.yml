name: Test caller_container input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: First run to get docker_container output
        id: first-run
        uses: .
        continue-on-error: true
        with:
          quit_without_error: '1'
          post_comment: '0'
      - name: Second run passing caller_container input
        id: action
        uses: .
        continue-on-error: true
        with:
          caller_container: ${{ steps.first-run.outputs.docker_container }}
          quit_without_error: '1'
          post_comment: '0'
      - name: Assert action ran with caller_container input
        env:
          OUTCOME: ${{ steps.action.outcome }}
          DOCKER_CONTAINER: ${{ steps.first-run.outputs.docker_container }}
          RESULT_CODE: ${{ steps.action.outputs.result_code }}
        run: |
          echo "outcome: $OUTCOME"
          echo "docker_container from first run: $DOCKER_CONTAINER"
          echo "result_code: $RESULT_CODE"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with caller_container input"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under harness with sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
