name: Test extra inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          GITHUB_TOKEN: ${{ github.token }}
          config: >-
            ${{ github.workspace }}/tests/fixtures/basic-spelling
          experimental_path: >-
            ${{ github.workspace }}/tests/fixtures/basic-content
          post_comment: "0"
          quit_without_error: "1"
          checkout: ""
          check_extra_dictionaries: ""
          use_sarif: ""
          ignore_security_advisory: ""
          # Inputs required for coverage
          bucket: ""
          project: ""
          debug: "0"
          experimental_parallel_jobs: "1"
          ignore-next-line: "# spell-checker:disable-next-line"
          caller_container: ""
          checkout-token: ${{ github.token }}
          sarif-token: ${{ github.token }}
        continue-on-error: true

      - name: Assert action ran with extra inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          case "$OUTCOME" in
            success)
              echo "PASS: action completed successfully with extra inputs"
              ;;
            failure)
              echo "PASS: action ran but failed (expected under act with sentinel repo or security advisory)"
              ;;
            cancelled)
              echo "PASS: action was cancelled (expected under act when secpoll triggers workflow cancel)"
              ;;
            *)
              echo "FAIL: unexpected outcome '$OUTCOME'"
              exit 1
              ;;
          esac
