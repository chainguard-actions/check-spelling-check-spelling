name: Test extra inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up spelling config from fixtures
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.github/actions/spelling"
          cp "$GITHUB_WORKSPACE/hardened/tests/fixtures/spelling/expect.txt" \
             "$GITHUB_WORKSPACE/.github/actions/spelling/expect.txt"
          cp "$GITHUB_WORKSPACE/hardened/tests/fixtures/spelling/excludes.txt" \
             "$GITHUB_WORKSPACE/.github/actions/spelling/excludes.txt"
      - id: spelling
        uses: .
        with:
          config: .github/actions/spelling
          post_comment: '0'
          quit_without_error: '1'
          checkout: 'false'
          experimental_path: .
          event_aliases: '{"workflow_dispatch":"push"}'
          # Inputs under coverage test
          bucket: ''
          project: ''
          debug: '0'
          experimental_parallel_jobs: '1'
          caller_container: ''
          checkout-token: ${{ github.token }}
          sarif-token: ${{ github.token }}
        continue-on-error: true
      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.spelling.outcome }}
        run: |
          echo "spelling step outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: spelling step was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: spelling step ran with extra inputs (outcome=$OUTCOME)"
      - name: Assert result_code output is accessible
        env:
          RESULT_CODE: ${{ steps.spelling.outputs.result_code }}
        run: |
          echo "result_code: '$RESULT_CODE'"
          echo "PASS: result_code output is accessible"
